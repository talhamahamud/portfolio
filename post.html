<!doctype html>
<html lang="en" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Post — Talha Mahamud</title>
  <link rel="icon" type="image/png" href="static/images/android-chrome-512x512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&family=Noto+Serif+Bengali:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <!-- KaTeX for math -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>

  <!-- Bundled copy of /blogs/*.md, used when the page is opened as a local file
       (browsers block fetch() on file://). Regenerate with: python build-posts.py -->
  <script src="blogs/posts.js"></script>

  <link rel="stylesheet" href="static/css/style.css" />
</head>

<body data-page="blog">
  <div class="progress" id="progress"></div>
  <div class="bg-decor" aria-hidden="true"></div>
  <header class="site-header"></header>

  <main class="wrap wrap-narrow">
    <header class="article-head fade-up d1">
      <a class="back" href="blog.html"><i class="fas fa-arrow-left"></i> All posts</a>
      <div class="tags" id="postTags"></div>
      <h1 id="postTitle">Loading…</h1>
      <div class="meta">
        <span id="postDate"><i class="far fa-calendar"></i> —</span>
        <span><i class="far fa-user"></i> Talha Mahamud</span>
        <span id="postReadTime"><i class="far fa-clock"></i> —</span>
      </div>
    </header>

    <div class="article-rule"></div>

    <article class="prose fade-up d2" id="postBody">
      <div class="skeleton"><span></span><span></span><span></span><span></span><span></span><span></span></div>
    </article>

    <div class="article-foot reveal">
      <p>Thanks for reading. <em>Thoughts?</em></p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" href="blog.html"><i class="fas fa-arrow-left"></i> More posts</a>
        <a class="btn btn-primary" href="mailto:talhamahamudd@gmail.com"><i class="fas fa-envelope"></i> Write to me</a>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script src="static/js/site.js"></script>
  <script>
    /* ── Reading progress ── */
    const bar = document.getElementById('progress');
    window.addEventListener('scroll', () => {
      const h = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (h > 0 ? (scrollY / h) * 100 : 0) + '%';
    }, { passive: true });

    /* ── Load markdown post: post.html?id=<file name in /blogs without .md> ── */
    const postId = new URLSearchParams(location.search).get('id');
    if (!postId) location.href = 'blog.html';
    const cleanId = (postId || '').replace(/[^a-zA-Z0-9\-_]/g, '');
    const body = document.getElementById('postBody');

    function parseFrontMatter(text) {
      const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
      const meta = {};
      if (!match) return { meta, content: text };
      const unquote = v => ((v.startsWith('"') && v.endsWith('"')) || (v.startsWith("'") && v.endsWith("'"))) ? v.slice(1, -1) : v;
      match[1].split('\n').forEach(line => {
        const i = line.indexOf(':');
        if (i === -1) return;
        const key = line.slice(0, i).trim();
        let value = unquote(line.slice(i + 1).trim());
        if (value.startsWith('[') && value.endsWith(']')) {
          value = value.slice(1, -1).split(',').map(s => unquote(s.trim())).filter(Boolean);
        }
        meta[key] = value;
      });
      return { meta, content: text.slice(match[0].length) };
    }

    function formatDate(s) {
      const d = new Date(s);
      return isNaN(d) ? s : d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // Prefer the live .md file; fall back to the bundled copy (blogs/posts.js)
    // when fetch is unavailable, e.g. when the page is opened via file://.
    function loadPost(id) {
      const bundled = () => {
        if (window.POSTS && typeof window.POSTS[id] === 'string') return window.POSTS[id];
        throw new Error('Post not found: ' + id);
      };
      if (location.protocol === 'file:') return Promise.resolve().then(bundled);
      return fetch(`blogs/${id}.md`)
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .catch(bundled);
    }

    loadPost(cleanId)
      .then(text => {
        const { meta, content } = parseFrontMatter(text);
        const title = meta.title || cleanId.replace(/-/g, ' ');
        document.title = `${title} — Talha Mahamud`;
        document.getElementById('postTitle').textContent = title;

        if (meta.date) document.getElementById('postDate').innerHTML = `<i class="far fa-calendar"></i> ${formatDate(meta.date)}`;

        const words = content.trim().split(/\s+/).length;
        const readTime = meta.readTime || `${Math.max(1, Math.round(words / 220))} min read`;
        document.getElementById('postReadTime').innerHTML = `<i class="far fa-clock"></i> ${readTime}`;

        const tagsEl = document.getElementById('postTags');
        (Array.isArray(meta.tags) ? meta.tags : meta.tags ? [meta.tags] : []).forEach(tag => {
          const s = document.createElement('span');
          s.className = 'pill';
          s.textContent = tag;
          tagsEl.appendChild(s);
        });

        body.innerHTML = marked.parse(content);
        body.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
        body.querySelectorAll('img').forEach(img => { img.loading = 'lazy'; });
        if (window.hljs) body.querySelectorAll('pre code').forEach(b => hljs.highlightElement(b));
        if (window.renderMathInElement) {
          renderMathInElement(body, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false
          });
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('postTitle').textContent = 'Post not found';
        body.innerHTML = '<p>Sorry — this post could not be loaded. <a href="blog.html">Back to the blog</a>.</p>';
      });
  </script>
</body>

</html>
